# dv-flow (dfm) project file for fw-uart16550.
#
#   dfm run tests      Every simulation case.
#   dfm run smoke      The smoke case on every view.
#   dfm run lint-rtl   Verilator lint of the RTL (reference core + shim, and
#                      the core in its 32-bit configuration).
#
# Views (plan §5): `ref` (U2B0, docs/design/ref-bench.md), `wb` (the class
# model behind pins) and `rtl` (its lowered netlist; docs/design/fw-impl.md).
# The equivalence views come with the op-model (step 5).
package:
  name: org.fwip.uart16550

  # The DV archetype (dv-flow-libproject): the standard verbs (tests, smoke,
  # lint-rtl, tests-info, --sim, --build).
  uses: project.dv.uvm
  package-map: "${{ env.IVPM_PACKAGES }}/dv-flow-package-map.yaml"

  with:
    images:
      type: list
      value: [ref, wb]
      values: [ref, wb, rtl]
      cli: true
      desc: Views the universal tests run on (plan §5)
    view_tb:
      type: map
      value:
        ref: [uart16550_arm.sv, hdl_top_ref.sv, hvl_top_ref.sv]
        wb:  [uart16550_arm.sv, hdl_top_wb.sv, hvl_top_wb.sv]
        rtl: [uart16550_arm.sv, hdl_top_wb.sv, hvl_top_wb.sv]
    view_top:
      type: map
      value:
        ref: [hvl_top_ref]
        wb:  [hvl_top_wb]
        rtl: [hvl_top_wb]

  imports:
  - project.dv.uvm
  - hdlsim
  - hdllint
  - fw.proto.wb
  - fw.proto.uart
  - fw-hdl
  - fw.hdl.lower
  - rdl
  - org.fwvip.core
  - org.fwvip.uart

  fragments:
  - src/rdl/flow.yaml
  - src/ref/flow.yaml
  - src/spl/flow.yaml
  - src/spl-rtl/flow.yaml
  - tests/uvm/flow.yaml

  tasks:
  - override: src-rtl
    needs: [ref-rtl]

  - override: lint-rtl
    needs: [lint, lint-32]

  # The headline configuration: the 8-bit core behind the 32-bit shim.
  - name: lint
    uses: hdllint.Rtl
    needs: [ref-rtl]
    with:
      top: [oc_uart16550_wb32]
      waivers: lint-waivers.yaml

  # The core's own 32-bit configuration, with the debug interface (step 11).
  - name: lint-32
    uses: hdllint.Rtl
    needs: [ref-rtl-32]
    with:
      top: [uart_top]
      waivers: lint-waivers.yaml

  - override: tests
    needs: [uvm.uvm-universal, uvm.uvm-ref-only]

  - override: smoke
    needs: [uvm.uvm-universal]
    with:
      tests: [uvm-universal.smoke]
